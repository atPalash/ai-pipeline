<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Pipelines</title>
  <style>
    :root {
      --bg: #fdfdfe;
      --surface: #fff;
      --border: #dcdcde;
      --text: #28272d;
      --muted: #737278;
      --brand: #fc6d26;
      --blue: #1f75cb;
      --green: #108548;
      --red: #dd2b0e;
      --amber: #ab6100;
    }
    :root { font-family: -apple-system, BlinkMacBlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
    body { margin: 0; }
    header { height: 48px; box-sizing: border-box; padding: 0 16px; border-bottom: 1px solid #3b3a40; background: #29282d; color: #fff; display: flex; align-items: center; gap: 12px; }
    header .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
    header .brand-mark { width: 24px; height: 24px; border-radius: 5px; background: var(--brand); display: grid; place-items: center; color: #fff; font-size: 14px; }
    header .path { color: #c3c2c7; font-size: 13px; }
    main { max-width: 1180px; margin: 24px auto; padding: 0 24px; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    h1, h2, h3 { margin-top: 0; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    section { margin-bottom: 24px; }
    .panel { border: 1px solid var(--border); border-radius: 4px; background: var(--surface); margin-bottom: 16px; }
    .panel-header { min-height: 48px; box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .panel-header h2 { margin: 0; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 16px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { color: var(--muted); background: #fafafd; font-size: 12px; font-weight: 600; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fafafd; }
    button, input, textarea, select { font: inherit; }
    button { min-height: 32px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--text); cursor: pointer; }
    button:hover { background: #f0f0f0; }
    button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    button.primary:hover { background: #1068bf; }
    button.danger { color: var(--red); border-color: #f0a7a0; }
    input, textarea, select { box-sizing: border-box; padding: 7px 8px; width: 100%; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #a5c8ed; border-color: var(--blue); }
    textarea { min-height: 100px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .row { display: flex; gap: 8px; align-items: center; }
    .actions { display: flex; justify-content: flex-end; gap: 6px; }
    .actions button { flex-shrink: 0; white-space: nowrap; }
    .space { display: flex; justify-content: space-between; align-items: center; }
    .muted { color: var(--muted); }
    .error { color: var(--red); }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #a4a3a8; }
    .status.success .status-dot { background: var(--green); }
    .status.failed .status-dot, .status.rejected .status-dot, .status.canceled .status-dot { background: var(--red); }
    .status.running .status-dot { background: var(--blue); box-shadow: 0 0 0 3px #d9ebfa; }
    .status.pending .status-dot, .status.created .status-dot, .status.skipped .status-dot { background: var(--amber); }
    .status.waiting .status-dot { background: var(--amber); box-shadow: 0 0 0 3px #fff0d6; }
    .status-dot.success { background: var(--green); }
    .status-dot.failed, .status-dot.rejected, .status-dot.canceled { background: var(--red); }
    .status-dot.running { background: var(--blue); box-shadow: 0 0 0 3px #d9ebfa; }
    .status-dot.pending, .status-dot.created, .status-dot.skipped { background: var(--amber); }
    .pipeline-graph { position: relative; display: flex; gap: 48px; overflow-x: auto; padding: 24px; border: 1px solid var(--border); border-radius: 4px; background: #fafafd; }
    .pipeline-connectors { position: absolute; inset: 0; z-index: 0; overflow: visible; pointer-events: none; }
    .pipeline-stage { position: relative; z-index: 1; min-width: 220px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    .pipeline-stage h2 { min-height: 42px; box-sizing: border-box; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
    .pipeline-job { min-height: 42px; box-sizing: border-box; padding: 4px 8px; display: flex; align-items: center; gap: 6px; }
    .pipeline-job + .pipeline-job { border-top: 1px solid #f0f0f0; }
    .job-select { min-width: 0; min-height: 32px; flex: 1; padding: 5px 4px; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; text-align: left; }
    .job-select:hover, .job-select.selected { background: #f0f6fc; }
    .job-select b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-type { margin-left: auto; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .retry-icon { width: 28px; height: 28px; min-height: 28px; flex: 0 0 28px; padding: 5px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
    .retry-icon svg { width: 16px; height: 16px; fill: currentColor; }
    .retry-icon:hover { color: var(--blue); border-color: var(--blue); background: #f0f6fc; }
    .run-breadcrumb { margin-bottom: 16px; font-size: 13px; color: var(--muted); }
    details { border: 1px solid var(--border); border-radius: 4px; margin: 8px 0; background: #fff; }
    summary { padding: 10px 12px; cursor: pointer; font-weight: 600; }
    details[open] summary { border-bottom: 1px solid var(--border); }
    .log { background: #1f1e24; color: #ececef; margin: 0; padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; border-radius: 0 0 4px 4px; }
    .answer-form { padding: 12px; border-top: 1px solid var(--border); }
    .answer-form textarea { margin: 8px 0; }
    .stages { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; }
    .editor-stage { min-width: 300px; border: 1px solid var(--border); border-radius: 4px; background: #fafafd; padding: 12px; }
    .editor-stage .stage-title { margin-bottom: 10px; }
    .editor-job { border: 1px solid var(--border); border-radius: 4px; background: #fff; margin: 8px 0; padding: 10px; }
    .editor-job > * { margin-top: 6px; }
    .editor-job .row { margin-top: 0; }
    .prompt-editor { position: relative; }
    .command-suggestions { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; background: #fff; box-shadow: 0 4px 12px #0002; }
    .command-suggestion { width: 100%; min-height: 38px; border: 0; border-radius: 0; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .command-suggestion + .command-suggestion { border-top: 1px solid #f0f0f0; }
    .command-suggestion.active, .command-suggestion:hover { background: #f0f6fc; }
    .command-suggestion small { color: var(--muted); }
    .editor-actions { margin-top: 10px; display: flex; gap: 6px; }
    .field { margin: 10px 0; }
    .field label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
    .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand" onclick="location.hash='#/'"><span class="brand-mark">F</span><span>Factory</span></div>
    <span class="path">Pipelines</span>
  </header>
  <main id="app"></main>
  <script>
    const app = document.getElementById("app");
    let timer;
    let draft;
    let connectorGraph;
    let selectedRunId;
    let selectedJob;
    let selectedLogKey;
    let followLogTail = true;
    let copilotCommands = { skills: [], agents: [] };
    let commandRequest = 0;
    const terminalStatuses = ["success", "failed", "canceled"];
    const isPollingRun = run => !terminalStatuses.includes(run.status);

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const status = value => `<span class="status ${esc(value)}"><span class="status-dot"></span>${esc(value)}</span>`;

    function drawPipelineConnectors() {
      const graph = connectorGraph;
      if (!graph?.isConnected) return;

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      const width = graph.scrollWidth;
      const height = graph.scrollHeight;
      const graphRect = graph.getBoundingClientRect();
      const xOffset = graphRect.left + graph.clientLeft - graph.scrollLeft;
      const yOffset = graphRect.top + graph.clientTop - graph.scrollTop;
      svg.setAttribute("class", "pipeline-connectors");
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      svg.style.width = `${width}px`;
      svg.style.height = `${height}px`;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("aria-hidden", "true");

      const path = document.createElementNS(svgNS, "path");
      const segments = [];
      const stages = [...graph.querySelectorAll(".pipeline-stage")];
      stages.slice(0, -1).forEach((stage, index) => {
        const next = stages[index + 1];
        const sourceJobs = [...stage.querySelectorAll(".pipeline-job")];
        const targetJobs = [...next.querySelectorAll(".pipeline-job")];
        if (!sourceJobs.length || !targetJobs.length) return;

        const stageRect = stage.getBoundingClientRect();
        const nextRect = next.getBoundingClientRect();
        const railX = (stageRect.right + nextRect.left) / 2 - xOffset;
        const sourcePoints = sourceJobs.map(job => {
          const rect = job.getBoundingClientRect();
          return { x: rect.right - xOffset, y: (rect.top + rect.bottom) / 2 - yOffset };
        });
        const targetPoints = targetJobs.map(job => {
          const rect = job.getBoundingClientRect();
          return { x: rect.left - xOffset, y: (rect.top + rect.bottom) / 2 - yOffset };
        });
        const points = [...sourcePoints, ...targetPoints];
        segments.push(`M ${railX} ${Math.min(...points.map(point => point.y))} V ${Math.max(...points.map(point => point.y))}`);
        sourcePoints.forEach(point => segments.push(`M ${point.x} ${point.y} H ${railX}`));
        targetPoints.forEach(point => segments.push(`M ${railX} ${point.y} H ${point.x}`));
      });

      path.setAttribute("d", segments.join(" "));
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#cfcfd3");
      path.setAttribute("stroke-width", "2");
      svg.append(path);
      graph.querySelector(".pipeline-connectors")?.remove();
      graph.prepend(svg);
    }

    window.addEventListener("resize", drawPipelineConnectors);

    async function api(method, url, body) {
      const response = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!response.ok) {
        let detail = response.statusText;
        try { detail = (await response.json()).detail ?? detail; } catch {}
        throw new Error(Array.isArray(detail) ? detail.map(x => x.msg).join("; ") : detail);
      }
      return response.status === 204 ? null : response.json();
    }

    function route() {
      clearTimeout(timer);
      const [, view, id] = location.hash.split("/");
      if (view === "run") showRun(id);
      else if (view === "edit") showEditor(id);
      else if (view === "new") showEditor(null);
      else showHome();
    }
    window.addEventListener("hashchange", route);

    async function showHome() {
      const [pipelines, runs] = await Promise.all([api("GET", "/api/pipelines"), api("GET", "/api/runs")]);
      app.innerHTML = `
        <section>
          <div class="space"><h1>Pipelines</h1><button class="primary" onclick="location.hash='#/new'">New pipeline</button></div>
          <div class="panel">
            <div class="panel-header"><h2>Project pipelines</h2><span class="muted">${pipelines.length} configured</span></div>
            <table>
              <thead><tr><th>Name</th><th>Stages</th><th>Jobs</th><th></th></tr></thead>
              <tbody>${pipelines.map(p => `
                <tr>
                  <td><b>${esc(p.name)}</b> <span class="muted">#${esc(p.id)}</span></td>
                  <td>${p.stages.map(s => esc(s.name)).join(" → ")}</td>
                  <td>${p.stages.reduce((n, s) => n + s.jobs.length, 0)}</td>
                  <td><div class="actions">
                    <button class="primary" data-run="${esc(p.id)}">Run pipeline</button>
                    <button data-edit="${esc(p.id)}">Edit</button>
                    <button data-duplicate="${esc(p.id)}">Duplicate</button>
                    <button class="danger" data-delete="${esc(p.id)}">Delete</button>
                  </div></td>
                </tr>`).join("") || `<tr><td colspan="4" class="empty">No pipelines.</td></tr>`}</tbody>
            </table>
          </div>
        </section>
        <section>
          <div class="panel">
            <div class="panel-header">
              <h2>Recent runs</h2>
              <button class="danger" id="clear-runs" ${runs.some(r => ["success", "failed", "canceled"].includes(r.status)) ? "" : "disabled"}>Clear completed runs</button>
            </div>
            <table>
              <thead><tr><th>Status</th><th>Run</th><th>Pipeline</th><th>Stages</th></tr></thead>
              <tbody>${runs.map(r => `
                <tr>
                  <td>${status(r.status)}</td>
                  <td><a href="#/run/${esc(r.id)}">#${esc(r.id)}</a></td>
                  <td>${esc(r.pipeline_name)}</td>
                  <td>${r.stages.map(s => status(s.status)).join(" <span class='muted'>→</span> ")}</td>
                </tr>`).join("") || `<tr><td colspan="4" class="empty">No runs.</td></tr>`}</tbody>
            </table>
          </div>
        </section>`;

      app.querySelectorAll("[data-run]").forEach(button => button.onclick = async () => {
        const run = await api("POST", `/api/pipelines/${button.dataset.run}/run`);
        location.hash = `#/run/${run.id}`;
      });
      app.querySelectorAll("[data-edit]").forEach(button => button.onclick = () =>
        location.hash = `#/edit/${button.dataset.edit}`);
      app.querySelectorAll("[data-duplicate]").forEach(button => button.onclick = async () => {
        const source = pipelines.find(p => p.id === button.dataset.duplicate);
        const copy = { ...source, name: `${source.name} copy` };
        delete copy.id;
        try {
          await api("POST", "/api/pipelines", copy);
          await showHome();
        } catch (error) {
          alert(`Could not duplicate pipeline: ${error.message}`);
        }
      });
      app.querySelectorAll("[data-delete]").forEach(button => button.onclick = async () => {
        if (!confirm("Delete this pipeline?")) return;
        await api("DELETE", `/api/pipelines/${button.dataset.delete}`);
        showHome();
      });
      document.getElementById("clear-runs").onclick = async () => {
        if (!confirm("Clear completed run history? Active runs and workspaces will be kept.")) return;
        try {
          await api("DELETE", "/api/runs");
          await showHome();
        } catch (error) {
          alert(`Could not clear runs: ${error.message}`);
        }
      };
      if (runs.some(isPollingRun))
        timer = setTimeout(showHome, 1000);
    }

    async function showRun(id) {
      let run;
      try { run = await api("GET", `/api/runs/${id}`); }
      catch (error) { app.innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
      if (location.hash !== `#/run/${id}`) return;
      if (selectedRunId !== id) {
        selectedRunId = id;
        selectedJob = null;
      }
      if (selectedJob && !run.stages[selectedJob[0]]?.jobs[selectedJob[1]]) selectedJob = null;
      const selectedWaiting = selectedJob && run.stages[selectedJob[0]].jobs[selectedJob[1]].status === "waiting";
      if (!selectedWaiting) {
        run.stages.some((stage, si) => {
          const ji = stage.jobs.findIndex(job => job.status === "waiting");
          if (ji < 0) return false;
          selectedJob = [si, ji];
          return true;
        });
      }
      const selectedStage = selectedJob ? run.stages[selectedJob[0]] : null;
      const selected = selectedJob ? selectedStage.jobs[selectedJob[1]] : null;
      const logKey = selected ? `${id}:${selectedJob[0]}:${selectedJob[1]}` : null;
      const existingLog = app.querySelector(".log");
      const sameLog = logKey && selectedLogKey === logKey;
      const shouldFollowLog = !sameLog || followLogTail;
      const previousLogScrollTop = sameLog && existingLog ? existingLog.scrollTop : 0;

      app.innerHTML = `
        <div class="run-breadcrumb"><a href="#/">Pipelines</a> / ${esc(run.pipeline_name)}</div>
        <div class="space" style="margin-bottom:16px">
          <div class="row"><h1 style="margin:0">Pipeline #${esc(run.id)}</h1>${status(run.status)}</div>
          <div class="row"><a href="#/">← Back</a>
            ${!terminalStatuses.includes(run.status) ? `<button class="danger" id="cancel">Cancel pipeline</button>` : ""}
          </div>
        </div>
        <div class="pipeline-graph">
          ${run.stages.map((stage, si) => `
            <div class="pipeline-stage">
              <h2><span>${esc(stage.name)}</span>${status(stage.status)}</h2>
              ${stage.jobs.map((job, ji) => `
                <div class="pipeline-job">
                  <button class="job-select ${selectedJob?.[0] === si && selectedJob?.[1] === ji ? "selected" : ""}" data-job="${si},${ji}" aria-label="Show output for ${esc(job.name)}">
                    <span class="status-dot ${esc(job.status)}"></span>
                    <b>${esc(job.name)}</b>
                    <span class="job-type">${esc(job.type)}</span>
                  </button>
                  ${terminalStatuses.includes(run.status) && stage.status !== "created"
                    ? `<button class="retry-icon" data-retry="${si}" title="Rerun this stage and later stages" aria-label="Rerun ${esc(job.name)} and later stages">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
                      </button>` : ""}
                </div>`).join("")}
            </div>`).join("")}
        </div>
        ${selected ? `
          <section>
            <div class="panel">
              <div class="panel-header">
                <h2>${esc(selectedStage.name)} / ${esc(selected.name)}</h2>
                ${status(selected.status)}
              </div>
              <pre class="log">${esc(selected.log) || (selected.status === "running" ? "Waiting for output…" : "(no output)")}</pre>
              ${selected.status === "waiting" ? `
                <div class="answer-form">
                  <strong>Copilot is waiting for your answer.</strong>
                  <p>Answer in the displayed Copilot CLI session. Its updates appear here; Approve enables after you send a response.</p>
                  ${selected.copilot_session_id ? `
                    <p><code>copilot --resume=${esc(selected.copilot_session_id)}</code></p>
                    <button type="button" id="copy-session-command" data-session-id="${esc(selected.copilot_session_id)}">Copy CLI command</button>
                  ` : ""}
                  <button class="primary" id="approve" ${selected.copilot_user_confirmed ? "" : "disabled"}>Approve</button>
                </div>` : ""}
            </div>
          </section>` : `<p class="empty">Select a job above to view its output.</p>`}`;

      const log = app.querySelector(".log");
      if (log) {
        log.scrollTop = shouldFollowLog ? log.scrollHeight : previousLogScrollTop;
        selectedLogKey = logKey;
        followLogTail = shouldFollowLog;
        log.addEventListener("scroll", () => {
          followLogTail = log.scrollHeight - log.clientHeight - log.scrollTop <= 24;
        });
      } else {
        selectedLogKey = null;
        followLogTail = true;
      }

      connectorGraph = app.querySelector(".pipeline-graph");
      drawPipelineConnectors();

      app.querySelectorAll("[data-job]").forEach(button => button.onclick = () => {
        selectedJob = button.dataset.job.split(",").map(Number);
        showRun(id);
      });
      document.getElementById("cancel")?.addEventListener("click", async () => {
        await api("POST", `/api/runs/${id}/cancel`);
        showRun(id);
      });
      document.getElementById("approve")?.addEventListener("click", async event => {
        event.target.disabled = true;
        const [si, ji] = selectedJob;
        try {
          await api("POST", `/api/runs/${id}/stages/${si}/jobs/${ji}/approve`);
          await showRun(id);
        } catch (error) {
          event.target.disabled = false;
          alert(`Could not approve job: ${error.message}`);
        }
      });
      document.getElementById("copy-session-command")?.addEventListener("click", async event => {
        const command = `copilot --resume=${event.target.dataset.sessionId}`;
        try {
          await navigator.clipboard.writeText(command);
          event.target.textContent = "Copied";
        } catch (error) {
          alert(`Could not copy CLI command: ${error.message}`);
        }
      });
      app.querySelectorAll("[data-retry]").forEach(button => button.onclick = async () => {
        if (!confirm("Rerun this stage and later stages in the same pipeline?")) return;
        try {
          await api("POST", `/api/runs/${id}/stages/${button.dataset.retry}/retry`);
          await showRun(id);
        } catch (error) {
          alert(`Could not rerun stage: ${error.message}`);
        }
      });
      if (isPollingRun(run))
        timer = setTimeout(() => showRun(id), 1000);
    }

    async function showEditor(id) {
      if (id) {
        draft = await api("GET", `/api/pipelines/${id}`);
      } else {
        draft = {
          name: "new-pipeline",
          workdir: "",
          stages: [{ name: "build", jobs: [{ name: "job1", type: "python", script: "print('done')" }] }],
        };
      }
      await loadCopilotCommands(false);
      renderEditor();
    }

    async function loadCopilotCommands(updateEditor = true) {
      const request = ++commandRequest;
      const workdir = draft?.workdir || "";
      const commands = await api("GET", `/api/copilot-commands?workdir=${encodeURIComponent(workdir)}`);
      if (request !== commandRequest) return;
      copilotCommands = commands;
      if (updateEditor) app.querySelectorAll("[data-prompt]").forEach(updatePromptSuggestions);
    }

    function promptSuggestionState(textarea) {
      const cursor = textarea.selectionStart;
      const prefix = textarea.value.slice(0, cursor);
      if (prefix.includes("\n")) return null;

      if (prefix === "/") {
        return {
          end: cursor,
          items: [
            { type: "command", name: "skill", detail: "Choose a skill" },
            { type: "command", name: "agent", detail: "Choose an agent" },
            ...copilotCommands.skills.slice(0, 8).map(name => ({ type: "skill", name })),
          ],
        };
      }

      let match = prefix.match(/^\/(skill|agent)$/) || prefix.match(/^\/(skill|agent)\s+$/);
      let query = "";
      if (!match) {
        match = prefix.match(/^\/(skill|agent)\s+(\S+)$/);
        query = match?.[2] || "";
      }
      if (match) {
        const type = match[1];
        const names = copilotCommands[type === "skill" ? "skills" : "agents"];
        return {
          end: cursor,
          items: names
            .filter(name => name.toLowerCase().startsWith(query.toLowerCase()))
            .map(name => ({ type, name })),
        };
      }

      match = prefix.match(/^\/([^\s]+)$/);
      if (!match) return null;
      const shorthandQuery = match[1];
      return {
        end: cursor,
        items: copilotCommands.skills
          .filter(name => name.toLowerCase().startsWith(shorthandQuery.toLowerCase()))
          .map(name => ({ type: "skill", name })),
      };
    }

    function choosePromptSuggestion(textarea, state, item) {
      const replacement = item.type === "command"
        ? `/${item.name} `
        : item.type === "agent"
          ? `/agent ${item.name} `
          : `/skill ${item.name} `;
      textarea.value = replacement + textarea.value.slice(state.end);
      textarea.setSelectionRange(replacement.length, replacement.length);
      textarea.dispatchEvent(new Event("input", { bubbles: true }));
      textarea.focus();
    }

    function updatePromptSuggestions(textarea) {
      const list = textarea.closest(".prompt-editor").querySelector(".command-suggestions");
      const state = promptSuggestionState(textarea);
      if (!state?.items.length) {
        list.hidden = true;
        list.replaceChildren();
        return null;
      }

      list.innerHTML = state.items.map((item, index) => `
        <button type="button" class="command-suggestion${index === 0 ? " active" : ""}" role="option" aria-selected="${index === 0}" data-command-index="${index}">
          <span>/${esc(item.name)}</span><small>${esc(item.detail || (item.type === "agent" ? "Agent" : "Skill"))}</small>
        </button>`).join("");
      list.hidden = false;
      list.onmousedown = event => event.preventDefault();
      list.querySelectorAll("[data-command-index]").forEach(button => button.onclick = () =>
        choosePromptSuggestion(textarea, state, state.items[+button.dataset.commandIndex]));
      return state;
    }

    function renderEditor(error) {
      app.innerHTML = `
        <div class="run-breadcrumb"><a href="#/">Pipelines</a> / ${draft.id ? "Edit pipeline" : "New pipeline"}</div>
        <div class="space" style="margin-bottom:16px">
          <h1>${draft.id ? "Edit pipeline" : "New pipeline"}</h1>
          <div class="row"><a href="#/">Cancel</a><button class="primary" id="save">Save pipeline</button></div>
        </div>
        ${error ? `<p class="error">${esc(error)}</p>` : ""}
        <div class="panel">
          <div class="panel-header"><h2>Pipeline configuration</h2></div>
          <div style="padding:16px">
            <div class="field"><label>Name</label><input data-name value="${esc(draft.name)}"></div>
            <div class="field"><label>Working directory <span class="muted">(optional)</span></label><input data-workdir value="${esc(draft.workdir || "")}" placeholder="/existing/directory"></div>
            <div class="stages">
              ${draft.stages.map((stage, si) => `
                <div class="editor-stage">
                  <input class="stage-title" data-stage-name="${si}" value="${esc(stage.name)}" placeholder="Stage name">
                  ${stage.jobs.map((job, ji) => `
                    <div class="editor-job">
                      <div class="row">
                        <input data-job-name="${si},${ji}" value="${esc(job.name)}" placeholder="Job name">
                        <select data-job-type="${si},${ji}">
                          <option value="python" ${job.type !== "copilot" ? "selected" : ""}>python</option>
                          <option value="copilot" ${job.type === "copilot" ? "selected" : ""}>copilot</option>
                        </select>
                      </div>
                      ${job.type === "copilot"
                        ? `<div class="prompt-editor">
                            <textarea data-prompt="${si},${ji}" placeholder="Copilot prompt" aria-autocomplete="list">${esc(job.prompt || "")}</textarea>
                            <div class="command-suggestions" role="listbox" aria-label="Copilot command suggestions" hidden></div>
                          </div>`
                        : `<textarea data-script="${si},${ji}" placeholder="Python script">${esc(job.script || "")}</textarea>`}
                      <button class="danger" data-remove-job="${si},${ji}">Remove job</button>
                    </div>`).join("")}
                  <div class="editor-actions">
                    <button data-add-job="${si}">Add job</button>
                    <button class="danger" data-remove-stage="${si}">Remove stage</button>
                  </div>
                </div>`).join("")}
            </div>
            <p><button id="add-stage">Add stage</button></p>
          </div>
        </div>`;

      app.querySelector("[data-name]").oninput = e => draft.name = e.target.value;
      app.querySelector("[data-workdir]").oninput = e => draft.workdir = e.target.value;
      app.querySelector("[data-workdir]").onchange = () => loadCopilotCommands();
      app.querySelectorAll("[data-stage-name]").forEach(el => el.oninput = e =>
        draft.stages[+el.dataset.stageName].name = e.target.value);
      app.querySelectorAll("[data-job-name]").forEach(el => el.oninput = e => {
        const [si, ji] = el.dataset.jobName.split(",").map(Number);
        draft.stages[si].jobs[ji].name = e.target.value;
      });
      app.querySelectorAll("[data-job-type]").forEach(el => el.onchange = e => {
        const [si, ji] = el.dataset.jobType.split(",").map(Number);
        draft.stages[si].jobs[ji].type = e.target.value;
        renderEditor();
      });
      app.querySelectorAll("[data-script]").forEach(el => el.oninput = e => {
        const [si, ji] = el.dataset.script.split(",").map(Number);
        draft.stages[si].jobs[ji].script = e.target.value;
      });
      app.querySelectorAll("[data-prompt]").forEach(el => {
        let selectedIndex = 0;
        el.oninput = e => {
          const [si, ji] = el.dataset.prompt.split(",").map(Number);
          draft.stages[si].jobs[ji].prompt = e.target.value;
          selectedIndex = 0;
          updatePromptSuggestions(el);
        };
        el.onkeydown = event => {
          const state = promptSuggestionState(el);
          if (!state?.items.length) return;
          if (event.key === "Escape") {
            el.closest(".prompt-editor").querySelector(".command-suggestions").hidden = true;
          } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            selectedIndex = (selectedIndex + (event.key === "ArrowDown" ? 1 : -1) + state.items.length) % state.items.length;
            const list = el.closest(".prompt-editor").querySelector(".command-suggestions");
            list.querySelectorAll(".command-suggestion").forEach((option, index) => {
              option.classList.toggle("active", index === selectedIndex);
              option.setAttribute("aria-selected", String(index === selectedIndex));
            });
          } else if (event.key === "Enter" || event.key === "Tab") {
            event.preventDefault();
            choosePromptSuggestion(el, state, state.items[selectedIndex % state.items.length]);
            selectedIndex = 0;
          }
        };
        el.onblur = () => {
          el.closest(".prompt-editor").querySelector(".command-suggestions").hidden = true;
        };
      });
      app.querySelectorAll("[data-add-job]").forEach(el => el.onclick = () => {
        draft.stages[+el.dataset.addJob].jobs.push({ name: "job", type: "python", script: "print('done')" });
        renderEditor();
      });
      app.querySelectorAll("[data-remove-job]").forEach(el => el.onclick = () => {
        const [si, ji] = el.dataset.removeJob.split(",").map(Number);
        draft.stages[si].jobs.splice(ji, 1);
        if (!draft.stages[si].jobs.length) draft.stages.splice(si, 1);
        renderEditor();
      });
      app.querySelectorAll("[data-remove-stage]").forEach(el => el.onclick = () => {
        draft.stages.splice(+el.dataset.removeStage, 1);
        renderEditor();
      });
      app.querySelector("#add-stage").onclick = () => {
        draft.stages.push({ name: "stage", jobs: [{ name: "job", type: "python", script: "print('done')" }] });
        renderEditor();
      };
      app.querySelector("#save").onclick = async () => {
        try {
          const body = { name: draft.name, workdir: draft.workdir || "", stages: draft.stages };
          await api(draft.id ? "PUT" : "POST", draft.id ? `/api/pipelines/${draft.id}` : "/api/pipelines", body);
          location.hash = "#/";
        } catch (error) { renderEditor(error.message); }
      };
    }

    route();
  </script>
</body>
</html>
