<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Pipelines</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #222; background: #fff; }
    body { margin: 0; }
    header { padding: 12px 20px; border-bottom: 1px solid #ddd; font-weight: 700; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
    h1, h2, h3 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    button, input, textarea, select { font: inherit; }
    button { padding: 6px 10px; cursor: pointer; }
    input, textarea, select { box-sizing: border-box; padding: 6px; width: 100%; }
    textarea { min-height: 90px; font-family: monospace; }
    .row { display: flex; gap: 8px; align-items: center; }
    .space { display: flex; justify-content: space-between; align-items: center; }
    .muted { color: #777; }
    .error { color: #b00020; }
    .stages { display: flex; gap: 12px; overflow-x: auto; }
    .stage { min-width: 280px; border: 1px solid #ddd; border-radius: 4px; padding: 12px; }
    .job { border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; }
    .log { background: #191919; color: #eee; padding: 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>Factory Pipelines</header>
  <main id="app"></main>
  <script>
    const app = document.getElementById("app");
    let timer;
    let draft;

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function api(method, url, body) {
      const response = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!response.ok) {
        let detail = response.statusText;
        try { detail = (await response.json()).detail ?? detail; } catch {}
        throw new Error(Array.isArray(detail) ? detail.map(x => x.msg).join("; ") : detail);
      }
      return response.status === 204 ? null : response.json();
    }

    function route() {
      clearTimeout(timer);
      const [, view, id] = location.hash.split("/");
      if (view === "run") showRun(id);
      else if (view === "edit") showEditor(id);
      else if (view === "new") showEditor(null);
      else showHome();
    }
    window.addEventListener("hashchange", route);

    async function showHome() {
      const [pipelines, runs] = await Promise.all([api("GET", "/api/pipelines"), api("GET", "/api/runs")]);
      app.innerHTML = `
        <section>
          <div class="space"><h1>Pipelines</h1><button onclick="location.hash='#/new'">New pipeline</button></div>
          <table>
            <tr><th>Name</th><th>Stages</th><th>Jobs</th><th></th></tr>
            ${pipelines.map(p => `
              <tr>
                <td><b>${esc(p.name)}</b> <span class="muted">#${esc(p.id)}</span></td>
                <td>${p.stages.map(s => esc(s.name)).join(" → ")}</td>
                <td>${p.stages.reduce((n, s) => n + s.jobs.length, 0)}</td>
                <td>
                  <button data-run="${esc(p.id)}">Run</button>
                  <button data-edit="${esc(p.id)}">Edit</button>
                  <button data-delete="${esc(p.id)}">Delete</button>
                </td>
              </tr>`).join("") || `<tr><td colspan="4" class="muted">No pipelines.</td></tr>`}
          </table>
        </section>
        <section>
          <h2>Runs</h2>
          <table>
            <tr><th>Status</th><th>Run</th><th>Pipeline</th><th>Stages</th></tr>
            ${runs.map(r => `
              <tr>
                <td>${esc(r.status)}</td>
                <td><a href="#/run/${esc(r.id)}">#${esc(r.id)}</a></td>
                <td>${esc(r.pipeline_name)}</td>
                <td>${r.stages.map(s => esc(s.status)).join(" → ")}</td>
              </tr>`).join("") || `<tr><td colspan="4" class="muted">No runs.</td></tr>`}
          </table>
        </section>`;

      app.querySelectorAll("[data-run]").forEach(button => button.onclick = async () => {
        const run = await api("POST", `/api/pipelines/${button.dataset.run}/run`);
        location.hash = `#/run/${run.id}`;
      });
      app.querySelectorAll("[data-edit]").forEach(button => button.onclick = () =>
        location.hash = `#/edit/${button.dataset.edit}`);
      app.querySelectorAll("[data-delete]").forEach(button => button.onclick = async () => {
        if (!confirm("Delete this pipeline?")) return;
        await api("DELETE", `/api/pipelines/${button.dataset.delete}`);
        showHome();
      });
      if (runs.some(r => !["success", "failed", "canceled"].includes(r.status)))
        timer = setTimeout(showHome, 1000);
    }

    async function showRun(id) {
      let run;
      try { run = await api("GET", `/api/runs/${id}`); }
      catch (error) { app.innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
      if (location.hash !== `#/run/${id}`) return;

      app.innerHTML = `
        <div class="space">
          <h1>Run #${esc(run.id)} <span class="muted">· ${esc(run.status)}</span></h1>
          <div class="row"><a href="#/">Back</a>
            ${!["success", "failed", "canceled"].includes(run.status) ? `<button id="cancel">Cancel</button>` : ""}
          </div>
        </div>
        ${run.stages.map(stage => `
          <section>
            <h2>${esc(stage.name)} <span class="muted">· ${esc(stage.status)}</span></h2>
            ${stage.jobs.map(job => `
              <details open>
                <summary>${esc(job.name)} · ${esc(job.status)} · ${esc(job.type)}</summary>
                <pre class="log">${esc(job.log) || "(no output)"}</pre>
              </details>`).join("")}
          </section>`).join("")}`;

      document.getElementById("cancel")?.addEventListener("click", async () => {
        await api("POST", `/api/runs/${id}/cancel`);
        showRun(id);
      });
      if (!["success", "failed", "canceled"].includes(run.status))
        timer = setTimeout(() => showRun(id), 1000);
    }

    async function showEditor(id) {
      if (id) {
        draft = await api("GET", `/api/pipelines/${id}`);
      } else {
        draft = {
          name: "new-pipeline",
          workdir: "",
          stages: [{ name: "build", jobs: [{ name: "job1", type: "python", script: "print('done')" }] }],
        };
      }
      renderEditor();
    }

    function renderEditor(error) {
      app.innerHTML = `
        <div class="space">
          <h1>${draft.id ? "Edit pipeline" : "New pipeline"}</h1>
          <div class="row"><a href="#/">Cancel</a><button id="save">Save</button></div>
        </div>
        ${error ? `<p class="error">${esc(error)}</p>` : ""}
        <label>Name<input data-name value="${esc(draft.name)}"></label>
        <label>Working directory (optional)<input data-workdir value="${esc(draft.workdir || "")}" placeholder="/existing/directory"></label>
        <h2>Stages</h2>
        <div class="stages">
          ${draft.stages.map((stage, si) => `
            <div class="stage">
              <input data-stage-name="${si}" value="${esc(stage.name)}" placeholder="Stage name">
              ${stage.jobs.map((job, ji) => `
                <div class="job">
                  <input data-job-name="${si},${ji}" value="${esc(job.name)}" placeholder="Job name">
                  <select data-job-type="${si},${ji}">
                    <option value="python" ${job.type !== "copilot" ? "selected" : ""}>python</option>
                    <option value="copilot" ${job.type === "copilot" ? "selected" : ""}>copilot</option>
                  </select>
                  ${job.type === "copilot"
                    ? `<textarea data-prompt="${si},${ji}" placeholder="Copilot prompt">${esc(job.prompt || "")}</textarea>`
                    : `<textarea data-script="${si},${ji}" placeholder="Python script">${esc(job.script || "")}</textarea>`}
                  <button data-remove-job="${si},${ji}">Remove job</button>
                </div>`).join("")}
              <button data-add-job="${si}">Add job</button>
              <button data-remove-stage="${si}">Remove stage</button>
            </div>`).join("")}
        </div>
        <p><button id="add-stage">Add stage</button></p>`;

      app.querySelector("[data-name]").oninput = e => draft.name = e.target.value;
      app.querySelector("[data-workdir]").oninput = e => draft.workdir = e.target.value;
      app.querySelectorAll("[data-stage-name]").forEach(el => el.oninput = e =>
        draft.stages[+el.dataset.stageName].name = e.target.value);
      app.querySelectorAll("[data-job-name]").forEach(el => el.oninput = e => {
        const [si, ji] = el.dataset.jobName.split(",").map(Number);
        draft.stages[si].jobs[ji].name = e.target.value;
      });
      app.querySelectorAll("[data-job-type]").forEach(el => el.onchange = e => {
        const [si, ji] = el.dataset.jobType.split(",").map(Number);
        draft.stages[si].jobs[ji].type = e.target.value;
        renderEditor();
      });
      app.querySelectorAll("[data-script]").forEach(el => el.oninput = e => {
        const [si, ji] = el.dataset.script.split(",").map(Number);
        draft.stages[si].jobs[ji].script = e.target.value;
      });
      app.querySelectorAll("[data-prompt]").forEach(el => el.oninput = e => {
        const [si, ji] = el.dataset.prompt.split(",").map(Number);
        draft.stages[si].jobs[ji].prompt = e.target.value;
      });
      app.querySelectorAll("[data-add-job]").forEach(el => el.onclick = () => {
        draft.stages[+el.dataset.addJob].jobs.push({ name: "job", type: "python", script: "print('done')" });
        renderEditor();
      });
      app.querySelectorAll("[data-remove-job]").forEach(el => el.onclick = () => {
        const [si, ji] = el.dataset.removeJob.split(",").map(Number);
        draft.stages[si].jobs.splice(ji, 1);
        if (!draft.stages[si].jobs.length) draft.stages.splice(si, 1);
        renderEditor();
      });
      app.querySelectorAll("[data-remove-stage]").forEach(el => el.onclick = () => {
        draft.stages.splice(+el.dataset.removeStage, 1);
        renderEditor();
      });
      app.querySelector("#add-stage").onclick = () => {
        draft.stages.push({ name: "stage", jobs: [{ name: "job", type: "python", script: "print('done')" }] });
        renderEditor();
      };
      app.querySelector("#save").onclick = async () => {
        try {
          const body = { name: draft.name, workdir: draft.workdir || "", stages: draft.stages };
          await api(draft.id ? "PUT" : "POST", draft.id ? `/api/pipelines/${draft.id}` : "/api/pipelines", body);
          location.hash = "#/";
        } catch (error) { renderEditor(error.message); }
      };
    }

    route();
  </script>
</body>
</html>
